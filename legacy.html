<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FantAsta 2026/27 â€” Sporting Madonna</title>
<style>
:root{
  --bg:#0a0f1d;--panel:#111a2b;--panel2:#17233a;--panel3:#0e1728;
  --text:#eef4ff;--muted:#91a0b7;--border:#273651;--accent:#5aa7ff;
  --good:#3ddc97;--warn:#f4c95d;--bad:#ff6b86;--purple:#bda4ff;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1600px;margin:auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#5aa7ff,#bda4ff);display:grid;place-items:center;color:#07111f;font-weight:900}
h1{font-size:20px;margin:0} .sub{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:10px}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--accent);color:#07111f;border-color:transparent;font-weight:800}
.btn.danger{background:#3a1722;color:#ffd6df}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px}
.stat small{display:block;color:var(--muted);font-size:11px}.stat b{font-size:24px;display:block;margin-top:3px}
.layout{display:grid;grid-template-columns:1.22fr .78fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:13px}
.card h2{font-size:15px;margin:0 0 10px}.card h3{font-size:13px;margin:15px 0 8px;color:#c7d4e8}
.auction-grid{display:grid;grid-template-columns:1.6fr .55fr .9fr;gap:9px}
label small{color:var(--muted);display:block;margin:0 0 5px;font-size:11px}
.input,select{width:100%;border:1px solid var(--border);background:var(--panel3);color:var(--text);padding:10px 11px;border-radius:10px;outline:none}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.bid-input-wrap{display:grid;grid-template-columns:52px minmax(82px,1fr) 52px;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:18px;padding:6px}
.bid-btn{height:48px;border-radius:14px;border:0;background:#1e2b45;color:var(--text);font-size:30px;font-weight:900;display:grid;place-items:center;line-height:1}
.bid-btn:hover{filter:brightness(1.08)}
.bid-btn:active{transform:scale(.985)}
.bid-input{height:48px;text-align:center;font-size:28px;font-weight:900;padding:0 6px;border-radius:14px;border:0;background:transparent}
.bid-input:focus{border:0;box-shadow:none;outline:none}
@media(max-width:760px){
  .bid-input-wrap{grid-template-columns:50px minmax(88px,1fr) 50px}
  .bid-btn{height:50px;font-size:31px}
  .bid-input{height:50px;font-size:30px}
}

.input:focus,select:focus{border-color:var(--accent)}
.player-summary{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px}
.kpi small{display:block;color:var(--muted);font-size:10px}.kpi b{display:block;font-size:17px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.signal{padding:12px;margin-top:10px;border-radius:11px;font-weight:900;text-align:center;border:1px solid}
.signal.good{background:rgba(61,220,151,.10);border-color:rgba(61,220,151,.35);color:var(--good)}
.signal.warn{background:rgba(244,201,93,.10);border-color:rgba(244,201,93,.35);color:var(--warn)}
.signal.bad{background:rgba(255,107,134,.10);border-color:rgba(255,107,134,.35);color:var(--bad)}
.help{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
.row-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.teams{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.team{background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:9px}
.team.mine{outline:2px solid var(--accent)}
.team-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.team-name{font-weight:800;font-size:12px}.credits{font-weight:900;font-size:18px}
.slots{font-size:10px;color:var(--muted);margin-top:4px}
.bar{height:6px;background:#0a1220;border-radius:999px;margin-top:7px;overflow:hidden}.bar i{height:100%;display:block;background:var(--accent)}
.team details{margin-top:7px}.team summary{font-size:10px;color:var(--muted);cursor:pointer}
.roster{font-size:10px;line-height:1.55;margin-top:4px;color:#cdd8e8}
.full{grid-column:1/-1}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:7px;margin-bottom:8px}
.tablewrap{overflow:auto;max-height:500px;border:1px solid var(--border);border-radius:11px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:8px 9px;border-bottom:1px solid var(--border);font-size:11px;text-align:left}
th{position:sticky;top:0;background:#152039;z-index:1;color:#c5d2e7}
tr:hover td{background:#121d32}
.role{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#233452;font-weight:900}
.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:2px 6px;font-size:9px;color:#d8e2ef}
.star{border:0;background:transparent;color:#6f7d91;font-size:17px;padding:1px 4px}.star.on{color:var(--warn)}
.smallbtn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:5px 7px;border-radius:7px;font-size:10px}
.status-sold{color:var(--bad)}.status-free{color:var(--good)}.status-mine{color:var(--accent)}
.strategy-item{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px;margin-bottom:7px}
.strategy-line{displax:flex;justify-content:space-between;gap:8px}.strategy-line b:last-child{font-size:18px}
.history{max-height:260px;overflow:auto}
.history-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:11px}
.note{color:var(--muted);font-size:10px}
.fav-list{display:flex;flex-wrap:wrap;gap:5px}
.fav-chip{border:1px solid var(--border);background:var(--panel2);border-radius:999px;padding:5px 8px;font-size:10px;cursor:pointer}
dialog{width:min(760px,94vw);background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:15px;padding:14px}
dialog::backdrop{background:rgba(0,0,0,.7)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}
.toast{position:fixed;right:16px;bottom:16px;max-width:320px;padding:10px 12px;background:#19243a;border:1px solid var(--border);border-radius:10px;display:none}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.app{padding:9px}.stats{grid-template-columns:repeat(2,1fr)}.auction-grid,.filters{grid-template-columns:1fr}.player-summary{grid-template-columns:repeat(3,1fr)}.teams{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style>
</head>
