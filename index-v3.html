</head>

<iframe id="app" src="./index.html" title="FantAsta"></iframe>
<script>
const frame=document.getElementById('app');
function resizeFrame(){try{const d=frame.contentDocument;frame.style.height=Math.max(document.documentElement.clientHeight,d.documentElement.scrollHeight,d.body.scrollHeight)+'px';}catch(e){}}
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;if(!d)return;
  const style=d.createElement('style');style.textContent='.fa-live-leader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--panel3);font-size:11px}.fa-live-leader b{font-size:13px}.fa-bid-trail{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.fa-bid-step{border:1px solid var(--border);background:var(--panel2);border-radius:999px;padding:4px 7px;font-size:10px}.fa-bid-step.mine{border-color:var(--accent);color:var(--accent)}.fa-power-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.fa-power-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px}.fa-power-card.mine{outline:2px solid var(--accent)}.fa-power-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.fa-power-title{font-weight:800;font-size:12px}.fa-score{font-size:20px;font-weight:900;white-space:nowrap}.fa-threat{display:inline-block;margin-top:6px;border:1px solid var(--border);border-radius:999px;padding:3px 7px;font-size:9px;font-weight:800}.fa-threat.high{color:var(--bad);border-color:rgba(255,107,134,.4)}.fa-threat.medium{color:var(--warn);border-color:rgba(244,201,93,.4)}.fa-threat.low{color:var(--good);border-color:rgba(61,220,151,.4)}.fa-threat.out{color:var(--muted)}.fa-threat.mine{color:var(--accent);border-color:var(--accent)}.fa-power-bar{height:7px;background:#0a1220;border-radius:999px;overflow:hidden;margin-top:7px}.fa-power-bar i{display:block;height:100%;background:var(--accent)}.fa-power-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}.fa-power-meta>div{background:var(--panel3);border-radius:8px;padding:6px}.fa-power-meta small{display:block;color:var(--muted);font-size:9px}.fa-power-meta b{font-size:12px}.fa-pattern{margin-top:6px;color:var(--muted);font-size:9px}.fa-tactic{margin-top:7px;font-size:10px;line-height:1.4;color:#ced8e8}.fa-empty{color:var(--muted);font-size:11px}@media(max-width:760px){.fa-power-grid{grid-template-columns:1fr}.fa-power-meta{grid-template-columns:repeat(2,1fr)}}';d.head.appendChild(style);
  const signalHelp=d.getElementById('signalHelp');
  if(signalHelp){const leader=d.createElement('div');leader.id='faLiveLeader';leader.className='fa-live-leader';leader.innerHTML='<span>Leader asta</span><b>—</b>';signalHelp.after(leader);const trail=d.createElement('div');trail.id='faBidTrail';trail.className='fa-bid-trail';leader.after(trail);}
  const actions=d.querySelector('.row-actions'),mine=d.getElementById('mineBtn');
  if(actions&&mine){const log=d.createElement('button');log.type='button';log.className='btn primary';log.id='faLogBidBtn';log.textContent='↗ Registra rilancio';actions.insertBefore(log,mine);const undo=d.createElement('button');undo.type='button';undo.className='btn';undo.id='faUndoBidBtn';undo.textContent='↩ Annulla rilancio';actions.insertBefore(undo,mine);}
  const listTable=d.getElementById('playersTable'),listCard=listTable&&listTable.closest('.card.full');
  if(listCard){const power=d.createElement('div');power.className='card full';power.innerHTML='<h2>⚔️ Potenza d’acquisto sul giocatore selezionato</h2><div class="note" style="margin-bottom:8px">Il punteggio combina capienza matematica, crediti residui, necessità nel ruolo e comportamento di rilancio. Serve a capire chi può insidiarti e dove puoi esercitare pressione tattica.</div><div id="faPowerGrid" class="fa-power-grid"><div class="fa-empty">Seleziona un giocatore.</div></div>';listCard.before(power);}
  const s=d.createElement('script');s.textContent=`(function(){
    if(window.__fantastaPowerV3)return;window.__fantastaPowerV3=true;if(!state.bidEvents)state.bidEvents=[];
    function bids(n){return (state.bidEvents||[]).filter(x=>x.player===n).sort((a,b)=>a.ts-b.ts)}
    function lastBid(n){const a=bids(n);return a.length?a[a.length-1]:null}
    function cap(t,p){if(!t||!p||slotsLeft(t,p.role)<=0)return 0;return maxAffordable(t)}
    function stats(teamName,playerName=null){const out={againstMe:0,byMeAgainst:0,total:0,onPlayer:0},g={};for(const e of(state.bidEvents||[])){(g[e.player]||(g[e.player]=[])).push(e);if(e.team===teamName){out.total++;if(!playerName||e.player===playerName)out.onPlayer++;}}for(const[pn,raw]of Object.entries(g)){if(playerName&&pn!==playerName)continue;const a=raw.slice().sort((x,y)=>x.ts-y.ts);for(let i=1;i<a.length;i++){const prev=a[i-1],cur=a[i];if(teamName!==state.config.mine&&cur.team===teamName&&prev.team===state.config.mine)out.againstMe++;if(teamName!==state.config.mine&&cur.team===state.config.mine&&prev.team===teamName)out.byMeAgainst++;}}return out}
    function power(t,p,bid){const c=cap(t,p);if(c<=bid||c<=0)return 0;const maxC=Math.max(1,...state.teams.map(x=>cap(x,p))),st=stats(t.name,p.name);return Math.round(Math.max(0,Math.min(100,50*(c/maxC)+18*Math.max(0,Math.min(1,creditsLeft(t)/state.config.initialCredits))+17*Math.max(0,Math.min(1,slotsLeft(t,p.role)/Math.max(1,state.config.slots[p.role])))+15*Math.min(1,(st.onPlayer+st.againstMe*.6)/3))))}
    function threat(t,p,bid){const c=cap(t,p);if(slotsLeft(t,p.role)<=0)return{cls:'out',label:'RUOLO COMPLETO'};if(c<=bid)return{cls:'out',label:'FUORI GIOCO'};if(t.name===state.config.mine)return{cls:'mine',label:'SPORTING MADONNA'};const sc=power(t,p,bid),my=dynamicMax(p);if(c>my&&sc>=65)return{cls:'high',label:'PUÒ SUPERARTI'};if(sc>=72)return{cls:'high',label:'MINACCIA ALTA'};if(sc>=48)return{cls:'medium',label:'MINACCIA MEDIA'};return{cls:'low',label:'MINACCIA BASSA'}}
    function advice(t,p,bid){const c=cap(t,p),last=lastBid(p.name),st=stats(t.name,p.name),all=stats(t.name),my=dynamicMax(p);if(slotsLeft(t,p.role)<=0)return 'Non può più acquistare giocatori di ruolo '+p.role+'.';if(c<=bid)return 'Non può superare l’offerta corrente preservando 1 credito per ogni slot libero.';if(t.name===state.config.mine)return 'Tetto strategico: <b>'+my+'</b>. Tetto matematico: <b>'+c+'</b>. '+(bid<=my?'Sei ancora nella zona di rilancio prevista.':'Sei oltre il tetto strategico: inseguire ora deteriora il piano.');if(last&&last.team===t.name){const pressure=Math.max(bid,Math.min(my,Math.round(Math.min(c,p.baseMax*(1+Math.max(-.10,Math.min(.25,inflation(p.role))))))));if(my<=bid)return 'È leader a <b>'+bid+'</b>, ma il tuo tetto strategico è '+my+': non conviene provocare un altro rilancio.';if(pressure>bid)return 'È leader a <b>'+bid+'</b>. Zona di pressione prudente: fino a circa <b>'+pressure+'</b>, ma solo se saresti disposto ad aggiudicarti il giocatore a quel prezzo.';return 'È leader a '+bid+'. Hai poco margine tattico prima del tuo tetto strategico.';}if(st.againstMe>0)return 'Ti ha controrilanciato <b>'+st.againstMe+'</b> '+(st.againstMe===1?'volta':'volte')+' su questo giocatore. Può arrivare matematicamente a <b>'+c+'</b>.';if(all.againstMe>=2)return 'Storicamente aggressiva contro di te: <b>'+all.againstMe+'</b> controrilanci registrati. Su questo giocatore ha un tetto matematico di '+c+'.';if(my>bid&&c>bid)return 'Puoi insidiarla, ma il suo interesse reale è ancora incerto. Tetto matematico: '+c+'.';return 'Capienza su questo giocatore: <b>'+c+'</b>. Nessun segnale forte di aggressività contro Sporting Madonna.'}
    function renderExtra(){if(!state.bidEvents)state.bidEvents=[];const p=playerByName(byId('auctionPlayer').value),bid=+byId('currentBid').value||0,leader=byId('faLiveLeader'),trail=byId('faBidTrail'),grid=byId('faPowerGrid');if(!p){leader.innerHTML='<span>Leader asta</span><b>—</b>';trail.innerHTML='';grid.innerHTML='<div class="fa-empty">Seleziona un giocatore per confrontare la potenza d’acquisto delle 10 squadre.</div>';return}const bs=bids(p.name),last=bs.length?bs[bs.length-1]:null;leader.innerHTML=last?'<span>Leader asta</span><b>'+esc(last.team)+' · '+last.price+'</b>':'<span>Leader asta</span><b>Nessun rilancio registrato</b>';trail.innerHTML=bs.slice(-12).map(x=>'<span class="fa-bid-step '+(x.team===state.config.mine?'mine':'')+'">'+esc(x.team)+' '+x.price+'</span>').join('');const items=state.teams.map(t=>({t,cap:cap(t,p),score:power(t,p,bid),th:threat(t,p,bid),st:stats(t.name,p.name),all:stats(t.name)})).sort((a,b)=>b.score-a.score||b.cap-a.cap);grid.innerHTML=items.map(x=>'<div class="fa-power-card '+(x.t.name===state.config.mine?'mine':'')+'"><div class="fa-power-head"><div><div class="fa-power-title">'+esc(x.t.name)+(x.t.name===state.config.mine?' · TU':'')+'</div><span class="fa-threat '+x.th.cls+'">'+x.th.label+'</span></div><div class="fa-score">'+x.score+'/100</div></div><div class="fa-power-bar"><i style="width:'+x.score+'%"></i></div><div class="fa-power-meta"><div><small>Crediti</small><b>'+creditsLeft(x.t)+'</b></div><div><small>Slot '+p.role+'</small><b>'+slotsLeft(x.t,p.role)+'</b></div><div><small>Tetto matem.</small><b>'+x.cap+'</b></div><div><small>Margine</small><b>'+Math.max(0,x.cap-bid)+'</b></div></div><div class="fa-pattern">Su questo: '+x.st.onPlayer+' rilanci · contro di te: '+x.st.againstMe+' · storico contro di te: '+x.all.againstMe+'</div><div class="fa-tactic">'+advice(x.t,p,bid)+'</div></div>').join('')}
    function recordBid(){const p=playerByName(byId('auctionPlayer').value),price=+byId('currentBid').value||0,teamName=byId('bidder').value;if(!p){toast('Seleziona un calciatore valido.');return}if(soldEntry(p.name)){toast('Calciatore già assegnato.');return}const t=team(teamName);if(!t)return;if(price<1){toast('Inserisci un prezzo valido.');return}if(slotsLeft(t,p.role)<=0){toast(teamName+': nessuno slot '+p.role+' disponibile.');return}if(price>maxAffordable(t)){toast(teamName+' non può arrivare a '+price+' mantenendo la riserva minima.');return}const last=lastBid(p.name);if(last&&price<=last.price){toast('Il rilancio deve superare '+last.price+'.');return}if(last&&last.team===teamName){toast(teamName+' è già leader: seleziona chi effettua il controrilancio.');return}state.bidEvents.push({player:p.name,role:p.role,team:teamName,price,ts:Date.now()});saveState();renderExtra();toast('Rilancio registrato: '+teamName+' a '+price)}
    function undoBid(){const p=playerByName(byId('auctionPlayer').value);if(!p){toast('Seleziona un giocatore.');return}for(let i=state.bidEvents.length-1;i>=0;i--){if(state.bidEvents[i].player===p.name){const r=state.bidEvents.splice(i,1)[0],last=lastBid(p.name);byId('currentBid').value=last?last.price:1;saveState();renderAuction();toast('Annullato rilancio '+r.team+' a '+r.price);return}}toast('Nessun rilancio registrato per questo giocatore.')}
    const oldRenderAuction=renderAuction;renderAuction=function(){oldRenderAuction();renderExtra()};const oldRenderAll=renderAll;renderAll=function(){if(!state.bidEvents)state.bidEvents=[];oldRenderAll();renderExtra()};const oldAssign=assign;assign=function(teamName){const p=playerByName(byId('auctionPlayer').value),price=+byId('currentBid').value||0;if(p&&!soldEntry(p.name)&&price>0){const last=lastBid(p.name);if(!last||last.team!==teamName||last.price!==price)state.bidEvents.push({player:p.name,role:p.role,team:teamName,price,ts:Date.now()})}oldAssign(teamName)};
    byId('faLogBidBtn').addEventListener('click',recordBid);byId('faUndoBidBtn').addEventListener('click',undoBid);byId('currentBid').addEventListener('input',renderExtra);byId('bidder').parentElement.querySelector('small').textContent='Chi ha effettuato il controrilancio?';saveState();renderExtra();
  })();`;d.body.appendChild(s);
  resizeFrame();new ResizeObserver(resizeFrame).observe(d.body);
});
window.addEventListener('resize',resizeFrame);
</script>
