<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FantAsta 2026/27 — Sporting Madonna</title>
<style>
html,body{margin:0;background:#0a0f1d;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#loading{padding:24px;font-size:16px}
</style>
</head>
<body>
<div id="loading">Caricamento FantAsta…</div>
<script>
(async()=>{
  const files=[
    'chunk-01a.txt','chunk-01b.txt','chunk-02.txt','chunk-03.txt','chunk-04.txt','chunk-05.txt',
    'chunk-06a.txt','chunk-06b1.txt','chunk-06b2a.txt','chunk-06b2b.txt','chunk-06b2c.txt','chunk-06b2d.txt','chunk-07.txt',
    'chunk-08a.txt','chunk-08b.txt','chunk-08c.txt','chunk-08d.txt',
    'chunk-09a.txt','chunk-09b.txt','chunk-09c.txt'
  ];
  try{
    const parts=await Promise.all(files.map(name=>
      fetch('./app-chunks/'+name,{cache:'no-store'}).then(r=>{
        if(!r.ok) throw new Error(name+' '+r.status);
        return r.text();
      })
    ));
    const html=parts.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const el=document.getElementById('loading');
    if(el) el.textContent='Errore nel caricamento dell’app: '+err.message;
  }
})();
</script>
</body>
</html>
