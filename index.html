<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FantAsta 2026/27 — Sporting Madonna</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0a0f1d}#app{display:block;width:100%;min-height:100vh;border:0;background:#0a0f1d}</style>
</head>
<body>
<iframe id="app" src="./legacy.html" title="FantAsta"></iframe>
<script>
const frame=document.getElementById('app');
function resizeFrame(){try{const d=frame.contentDocument;frame.style.height=Math.max(document.documentElement.clientHeight,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch(e){}}
frame.addEventListener('load',()=>{const d=frame.contentDocument;if(!d)return;const s=d.createElement('script');s.src='./enhance.js';d.body.appendChild(s);resizeFrame();if(window.ResizeObserver)new ResizeObserver(resizeFrame).observe(d.body)});
window.addEventListener('resize',resizeFrame);
</script>
</body>
</html>
